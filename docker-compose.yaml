version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_gateway_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: ai_gateway_redis
    ports:
      - "6379:6379"